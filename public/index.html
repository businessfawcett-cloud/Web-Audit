<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Audit Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }

    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 36px; margin-bottom: 8px; }
    header p { color: #94a3b8; }

    .grid { display: grid; grid-template-columns: 350px 1fr; gap: 30px; }

    .panel { background: #1e293b; border-radius: 16px; padding: 24px; }
    .panel h2 { font-size: 18px; margin-bottom: 20px; color: #f8fafc; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #3b82f6; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-row .form-group { margin-bottom: 0; }

    textarea { width: 100%; height: 120px; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 13px; font-family: 'Monaco', 'Consolas', monospace; resize: vertical; }
    textarea:focus { outline: none; border-color: #3b82f6; }

    .auth-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
    .auth-toggle button { flex: 1; padding: 12px; background: #334155; border: none; border-radius: 8px; color: #94a3b8; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    .auth-toggle button.active { background: #3b82f6; color: white; }

    .auth-fields { display: none; }
    .auth-fields.show { display: block; }

    .buttons { display: flex; gap: 12px; margin-top: 24px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #475569; color: white; }
    .btn-secondary:hover { background: #64748b; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .log-panel { display: flex; flex-direction: column; height: calc(100vh - 200px); }
    .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .progress { font-size: 14px; color: #94a3b8; }
    .progress-bar { height: 6px; background: #334155; border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .progress-fill { height: 100%; background: #3b82f6; border-radius: 3px; transition: width 0.3s; }

    .log-output { flex: 1; background: #0f172a; border-radius: 8px; padding: 16px; overflow-y: auto; font-family: 'Monaco', 'Consolas', monospace; font-size: 13px; line-height: 1.6; }
    .log-line { padding: 4px 0; border-bottom: 1px solid #1e293b; }
    .log-line.error { color: #f87171; }
    .log-line.success { color: #4ade80; }
    .log-line.warning { color: #fbbf24; }
    .log-line.info { color: #60a5fa; }

    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-left: 10px; }
    .status-idle { background: #334155; color: #94a3b8; }
    .status-running { background: #3b82f6; color: white; }
    .status-complete { background: #22c55e; color: white; }
    .status-error { background: #dc2626; color: white; }

    .otp-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 100; }
    .otp-modal.show { display: flex; }
    .otp-box { background: #1e293b; padding: 30px; border-radius: 16px; width: 400px; text-align: center; }
    .otp-box h3 { margin-bottom: 20px; }
    .otp-box input { width: 100%; padding: 16px; font-size: 24px; text-align: center; letter-spacing: 8px; margin-bottom: 20px; }

    .report-section { margin-top: 20px; display: none; }
    .report-section.show { display: block; }
    .report-section a { display: inline-block; padding: 12px 24px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🕷️ Web Audit Agent</h1>
      <p>Automated crawling, screenshot capture, and error reporting</p>
    </header>

    <div class="grid">
      <div class="panel">
        <h2>⚙️ Configuration</h2>

        <div class="form-group">
          <label>Target URL</label>
          <input type="text" id="url" placeholder="https://your-app.com">
        </div>

        <div class="form-group">
          <label>Seed URLs (one per line)</label>
          <textarea id="seedUrls" placeholder="https://your-app.com/dashboard&#10;https://your-app.com/profile&#10;https://your-app.com/settings"></textarea>
        </div>

        <div class="auth-toggle">
          <button type="button" id="authCookies" class="active">Cookies</button>
          <button type="button" id="authClerk">Clerk</button>
        </div>

        <div id="cookiesFields">
          <div class="form-group">
            <label>Session Cookies (JSON)</label>
            <textarea id="cookies" placeholder='[{"name": "session", "value": "..."}]'></textarea>
          </div>
        </div>

        <div id="clerkFields" class="auth-fields">
          <div class="form-group">
            <label>Clerk Email</label>
            <input type="email" id="clerkEmail" placeholder="user@example.com">
          </div>
          <div class="form-group">
            <label>Sign-In URL (optional)</label>
            <input type="text" id="signInUrl" placeholder="/sign-in">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Max Depth</label>
            <input type="number" id="maxDepth" value="3" min="1" max="10">
          </div>
          <div class="form-group">
            <label>Max States</label>
            <input type="number" id="maxStates" value="200" min="10" max="1000">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Viewport Width</label>
            <input type="number" id="viewportWidth" value="1280">
          </div>
          <div class="form-group">
            <label>Viewport Height</label>
            <input type="number" id="viewportHeight" value="800">
          </div>
        </div>

        <div class="buttons">
          <button type="button" class="btn btn-secondary" id="dryRunBtn">Dry Run</button>
          <button type="button" class="btn btn-primary" id="runBtn">Run Full Audit</button>
          <button type="button" class="btn btn-danger" id="stopBtn" style="display:none;">Stop</button>
        </div>

        <div class="report-section" id="reportSection">
          <a href="/output/audit-report.html" target="_blank">📊 View Full Report</a>
        </div>
      </div>

      <div class="panel log-panel">
        <div class="log-header">
          <h2>📋 Live Log</h2>
          <div>
            <span class="status-badge status-idle" id="statusBadge">Idle</span>
            <span class="progress" id="progress"></span>
          </div>
        </div>
        <div class="progress-bar" id="progressBar" style="display:none;">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="log-output" id="logOutput">
          <div class="log-line">Ready. Configure settings and click "Dry Run" or "Run Full Audit".</div>
        </div>
      </div>
    </div>
  </div>

  <div class="otp-modal" id="otpModal">
    <div class="otp-box">
      <h3>🔐 Enter OTP Code</h3>
      <p style="color: #94a3b8; margin-bottom: 20px;">Check your email for the 6-digit code</p>
      <input type="text" id="otpInput" maxlength="6" placeholder="000000">
      <button class="btn btn-primary" id="otpSubmit" style="width: 100%;">Verify</button>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('url');
    const seedUrlsInput = document.getElementById('seedUrls');
    const cookiesInput = document.getElementById('cookies');
    const clerkEmailInput = document.getElementById('clerkEmail');
    const signInUrlInput = document.getElementById('signInUrl');
    const maxDepthInput = document.getElementById('maxDepth');
    const maxStatesInput = document.getElementById('maxStates');
    const viewportWidthInput = document.getElementById('viewportWidth');
    const viewportHeightInput = document.getElementById('viewportHeight');

    const authCookiesBtn = document.getElementById('authCookies');
    const authClerkBtn = document.getElementById('authClerk');
    const cookiesFields = document.getElementById('cookiesFields');
    const clerkFields = document.getElementById('clerkFields');

    const dryRunBtn = document.getElementById('dryRunBtn');
    const runBtn = document.getElementById('runBtn');
    const stopBtn = document.getElementById('stopBtn');
    const logOutput = document.getElementById('logOutput');
    const statusBadge = document.getElementById('statusBadge');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const reportSection = document.getElementById('reportSection');

    const otpModal = document.getElementById('otpModal');
    const otpInput = document.getElementById('otpInput');
    const otpSubmit = document.getElementById('otpSubmit');

    let eventSource = null;
    let isRunning = false;

    function connectSSE() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource('/events');

      eventSource.addEventListener('log', e => {
        const data = JSON.parse(e.data);
        addLog(data.message);
      });

      eventSource.addEventListener('status', e => {
        const data = JSON.parse(e.data);
        updateStatus(data.status, data.message);
        if (data.summary) {
          addLog(`📊 Summary: ${data.summary.totalPages} pages, ${data.summary.totalErrors} errors, ${data.summary.totalWarnings} warnings`);
          reportSection.classList.add('show');
        }
      });

      eventSource.addEventListener('progress', e => {
        const data = JSON.parse(e.data);
        progress.textContent = `${data.current} / ${data.max} pages`;
        progressBar.style.display = 'block';
        progressFill.style.width = `${(data.current / data.max) * 100}%`;
      });

      eventSource.addEventListener('error', e => {
        const data = JSON.parse(e.data);
        addLog(data.message, 'error');
      });

      eventSource.addEventListener('clerk-prompt', e => {
        otpModal.classList.add('show');
        otpInput.value = '';
        otpInput.focus();
      });

      eventSource.addEventListener('report-ready', e => {
        reportSection.classList.add('show');
      });
    }

    function addLog(message, type = '') {
      const line = document.createElement('div');
      line.className = `log-line ${type}`;
      line.textContent = message;
      logOutput.appendChild(line);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    function updateStatus(status, message) {
      statusBadge.className = `status-badge status-${status}`;
      statusBadge.textContent = message || status;

      if (status === 'running' || status === 'starting' || status === 'crawling') {
        isRunning = true;
        runBtn.style.display = 'none';
        dryRunBtn.style.display = 'none';
        stopBtn.style.display = 'block';
      } else {
        isRunning = false;
        runBtn.style.display = 'block';
        dryRunBtn.style.display = 'block';
        stopBtn.style.display = 'none';
        progressBar.style.display = 'none';
      }
    }

    function getConfig() {
      const cookies = cookiesInput.value.trim() ? JSON.parse(cookiesInput.value) : [];
      const seedUrls = seedUrlsInput.value.trim() 
        ? seedUrlsInput.value.split('\n').map(s => s.trim()).filter(s => s)
        : [];
      return {
        url: urlInput.value,
        seedUrls,
        authMode: authCookiesBtn.classList.contains('active') ? 'cookies' : 'clerk',
        cookies,
        clerkEmail: clerkEmailInput.value,
        signInUrl: signInUrlInput.value,
        maxDepth: parseInt(maxDepthInput.value),
        maxStates: parseInt(maxStatesInput.value),
        viewport: {
          width: parseInt(viewportWidthInput.value),
          height: parseInt(viewportHeightInput.value)
        }
      };
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();

        urlInput.value = config.url || '';
        seedUrlsInput.value = config.seedUrls?.length ? config.seedUrls.join('\n') : '';
        cookiesInput.value = config.cookies?.length ? JSON.stringify(config.cookies, null, 2) : '';
        clerkEmailInput.value = config.clerkEmail || '';
        signInUrlInput.value = config.signInUrl || '';
        maxDepthInput.value = config.maxDepth || 3;
        maxStatesInput.value = config.maxStates || 200;
        viewportWidthInput.value = config.viewport?.width || 1280;
        viewportHeightInput.value = config.viewport?.height || 800;

        if (config.authMode === 'clerk') {
          authClerkBtn.click();
        }
      } catch (e) {
        console.error('Failed to load config:', e);
      }
    }

    authCookiesBtn.addEventListener('click', () => {
      authCookiesBtn.classList.add('active');
      authClerkBtn.classList.remove('active');
      cookiesFields.style.display = 'block';
      clerkFields.classList.remove('show');
    });

    authClerkBtn.addEventListener('click', () => {
      authClerkBtn.classList.add('active');
      authCookiesBtn.classList.remove('active');
      cookiesFields.style.display = 'none';
      clerkFields.classList.add('show');
    });

    dryRunBtn.addEventListener('click', async () => {
      logOutput.innerHTML = '';
      reportSection.classList.remove('show');
      connectSSE();

      const config = getConfig();
      if (!config.url) {
        addLog('❌ Please enter a URL', 'error');
        return;
      }

      try {
        await fetch('/api/audit/dry-run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config)
        });
      } catch (e) {
        addLog(`❌ Error: ${e.message}`, 'error');
      }
    });

    runBtn.addEventListener('click', async () => {
      logOutput.innerHTML = '';
      reportSection.classList.remove('show');
      connectSSE();

      const config = getConfig();
      if (!config.url) {
        addLog('❌ Please enter a URL', 'error');
        return;
      }

      try {
        await fetch('/api/audit/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config)
        });
      } catch (e) {
        addLog(`❌ Error: ${e.message}`, 'error');
      }
    });

    stopBtn.addEventListener('click', async () => {
      try {
        await fetch('/api/audit/stop', { method: 'POST' });
        addLog('🛑 Stopping audit...');
      } catch (e) {
        addLog(`❌ Error: ${e.message}`, 'error');
      }
    });

    otpSubmit.addEventListener('click', async () => {
      const otp = otpInput.value.trim();
      if (!/^\d{6}$/.test(otp)) {
        alert('Please enter a 6-digit OTP code');
        return;
      }

      try {
        const res = await fetch('/api/clerk/submit-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ otp })
        });

        const data = await res.json();
        if (data.success) {
          otpModal.classList.remove('show');
          addLog('✅ OTP verified, continuing audit...');
        } else {
          alert('Invalid OTP, please try again');
        }
      } catch (e) {
        alert(`Error: ${e.message}`);
      }
    });

    otpInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') otpSubmit.click();
    });

    loadConfig();
  </script>
</body>
</html>
